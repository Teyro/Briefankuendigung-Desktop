# Xcode-Projekt für App + Widgets. Erzeugen: xcodegen generate
name: Briefankuendigung
options:
  bundleIdPrefix: de.teyro
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  BriefLogik:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Ohne Apple-Entwicklerkonto: lokal signieren ("Sign to Run Locally")
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ARCHS: "arm64 x86_64"
    ONLY_ACTIVE_ARCH: NO
    DEAD_CODE_STRIPPING: YES
targets:
  Briefankuendigung:
    type: application
    platform: macOS
    sources:
      - path: Sources/BriefApp
      - path: Sources/Widgets
      - path: ressourcen/AppIcon.icns
        buildPhase: resources
      - path: ressourcen/i18n
        type: folder
        buildPhase: resources
      - path: ressourcen/sprachen
        buildPhase: resources
    dependencies:
      - package: BriefLogik
      - target: BriefWidgets
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_NAME: Briefankuendigung
        EXECUTABLE_NAME: Briefankuendigung
        PRODUCT_BUNDLE_IDENTIFIER: de.teyro.briefankuendigung
        INFOPLIST_FILE: ressourcen/Info.plist
        GENERATE_INFOPLIST_FILE: NO
  BriefWidgets:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/WidgetErweiterung
      - path: Sources/Widgets
      - path: ressourcen/i18n
        type: folder
        buildPhase: resources
      - path: ressourcen/sprachen
        buildPhase: resources
    dependencies:
      - package: BriefLogik
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    settings:
      base:
        PRODUCT_NAME: BriefWidgets
        PRODUCT_BUNDLE_IDENTIFIER: de.teyro.briefankuendigung.widgets
        INFOPLIST_FILE: ressourcen/Widgets-Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: ressourcen/Widgets.entitlements
        SKIP_INSTALL: YES
schemes:
  Briefankuendigung:
    build:
      targets:
        Briefankuendigung: all
        BriefWidgets: all
